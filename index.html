<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق Gemini الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-xl">
        <h1 class="text-2xl font-bold text-center mb-4 text-gray-800">مساعد Gemini الذكي</h1>
        
        <div class="mb-4">
            <textarea id="userInput" rows="4" class="w-full p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="اكتب سؤالك أو طلبك هنا..."></textarea>
        </div>
        
        <button onclick="sendToGemini()" id="sendBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition">إرسال الطلب</button>
        
        <div id="loading" class="hidden text-center my-4 text-blue-600 font-semibold">جاري المعالجة...</div>
        
        <div id="resultArea" class="mt-6 p-4 bg-gray-50 rounded-xl border hidden text-gray-700 whitespace-pre-wrap"></div>
    </div>

    <script>
        async function sendToGemini() {
            const promptText = document.getElementById('userInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            const loading = document.getElementById('loading');
            const sendBtn = document.getElementById('sendBtn');

            if (!promptText) {
                alert('الرجاء كتابة نص أولاً');
                return;
            }

            loading.classList.remove('hidden');
            resultArea.classList.add('hidden');
            sendBtn.disabled = true;

            const apiKey = "AQ.Ab8RN6Kvoao748kSZpZNaYx-Do-WVuRsRDcMZ6V5fKVD6fnfLg";
            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: promptText }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error?.message || "خطأ في الاتصال بالسيرفر");
                }

                const output = data.candidates[0].content.parts[0].text;
                resultArea.textContent = output;
                resultArea.classList.remove('hidden');
            } catch (error) {
                console.error("خطأ:", error);
                alert("خطأ تقني: " + error.message);
            } finally {
                loading.classList.add('hidden');
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>

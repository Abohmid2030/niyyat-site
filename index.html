<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلسلة النيات مع بدري – أن تحيا بنيّة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }
        .custom-card { background: linear-gradient(to bottom right, #f0fdf4, #ffffff); border: 1px solid #bbf7d0; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">
    <header class="bg-emerald-800 text-white py-8 shadow-md">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl md:text-4xl font-black mb-2">سلسلة النيات مع بدري</h1>
            <p class="text-emerald-100 text-lg">أن تحيا بنيّة.. تحويل الأعمال والأحوال إلى عبادة</p>
        </div>
    </header>
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow">
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8 mb-8 border border-slate-100">
            <label for="topicInput" class="block text-lg font-bold text-slate-700 mb-3">ما هو العمل أو الموضوع الذي تريد استخراج نياته؟</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="topicInput" placeholder="مثال: صلة الرحم، طلب العلم، التجارة، الصيام..." 
                    class="flex-grow px-4 py-3.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 text-lg">
                <button id="generateBtn" onclick="generateNiyyat()" 
                    class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-8 py-3.5 rounded-xl transition duration-200 shadow-md">
                    استخراج النيات
                </button>
            </div>
        </div>
        <div id="resultContainer" class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 border border-slate-100">
            <div id="loadingDiv" class="text-center py-16 hidden">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-emerald-600 border-t-transparent mb-4"></div>
                <p class="text-lg font-medium text-emerald-800">⏳ جاري استخراج النيات بعمق ودقة شرعية مطابقة تماماً للـ Custom GPT...</p>
            </div>
            <div id="outputContent" class="text-slate-700 leading-relaxed space-y-6"></div>
        </div>
    </main>
    <footer class="bg-slate-800 text-slate-300 py-6 text-center text-sm border-t border-slate-700">
        <p>جميع الحقوق محفوظة © سلسلة النيات مع بدري</p>
    </footer>
    <script>
        async function generateNiyyat() {
            const topic = document.getElementById('topicInput').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const loadingDiv = document.getElementById('loadingDiv');
            const outputContent = document.getElementById('outputContent');
            const generateBtn = document.getElementById('generateBtn');

            if (!topic) { 
                alert('الرجاء إدخال اسم العمل أو الموضوع.'); 
                return; 
            }

            resultContainer.classList.remove('hidden');
            loadingDiv.classList.remove('hidden');
            outputContent.innerHTML = '';
            generateBtn.disabled = true;

            const systemPrompt = `نظام معرفي دعوي–تربوي يحوّل الأعمال والأحوال إلى عبادة بالنية الصحيحة المنضبطة بالنص. الاسم: سلسلة النيات مع بدري – أن تحيا بنيّة. قواعد صارمة للإخراج: أخرج بالترتيب: خلاصة النيات بصيغة بطاقة أو قائمة + مقدمة ثابتة + حكم العمل + 7 إلى 12 نية بنص ومرجع من القرآن أو السنة الصحيحة + التطبيق العملي + الأسئلة الختامية + الخاتمة الثابتة. ممنوع الحديث الضعيف. اذكر السورة ورقم الآية ورقم الحديث. ممنوع استخدام: نويت / قل في قلبك. المعتمد: استحضر بقلبك نية.`;

            const apiKey = "AIzaSyAWwEgw6wiuWUR2xlxS35t2cp_Iiv0aI30";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ 
                            parts: [{ text: `${systemPrompt}\n\nالمطلوب استخراج النيات لهذا العمل بالتفصيل الكامل: ${topic}` }] 
                        }] 
                    })
                });
                
                const data = await response.json();
                loadingDiv.classList.add('hidden');
                
                if (data.candidates && data.candidates[0]) {
                    const text = data.candidates[0].content.parts[0].text;
                    outputContent.innerHTML = `<div class="custom-card p-6 rounded-2xl shadow-sm mb-6">${text.replace(/\n/g, '<br>')}</div>`;
                } else if (data.error) {
                    outputContent.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-xl">خطأ تقني: ${data.error.message}</div>`;
                } else {
                    outputContent.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-xl">تعذر جلب النتيجة من الخادم.</div>`;
                }
            } catch (err) {
                loadingDiv.classList.add('hidden');
                outputContent.innerHTML = `<div class="p-4 bg-red-50 text-red-700 rounded-xl">حدث خطأ في الاتصال بالشبكة.</div>`;
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
